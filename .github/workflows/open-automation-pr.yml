name: Open automation pull request

on:
  push:
    branches:
      - automation/issue-*

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const issue = branch.match(/^automation\/issue-(\d+)$/)?.[1];
            if (!issue) core.setFailed(`Unexpected branch: ${branch}`);
            const existing = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open'
            });
            if (existing.data.length) return;
            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: branch,
              base: 'master',
              title: `Automated implementation for issue #${issue}`,
              body: `Implements #${issue}.\n\nGenerated by the guarded local Codex issue agent. Human review is required before merge.`,
              draft: true
            });
